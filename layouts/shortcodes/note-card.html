{{- $title := .Get "title" -}}
{{- $image := .Page.Resources.GetMatch (.Get "image") -}}
<article class="conference-note-card">
  <div class="conference-note-card__details">
    <h3 class="conference-note-card__title">{{ $title }}</h3>
    <div class="conference-note-card__speakers">
      <span class="conference-note-card__speaker-label">Speakers</span>
      <span class="conference-note-card__speaker-list">{{ .Inner }}</span>
    </div>
  </div>
  {{ with $image }}
    <a class="conference-note-card__image-link" href="{{ .RelPermalink }}" aria-label="View handwritten notes for {{ $title }}">
      <img class="conference-note-card__image" src="{{ .RelPermalink }}" alt="Handwritten notes for {{ $title }}" loading="lazy" />
    </a>
  {{ end }}
</article>
